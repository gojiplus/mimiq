version: 2

# One entry per manifest directory. Group names are load-bearing: the
# auto-merge gate matches the glob `*minor-and-patch*`, so the `-security`
# groups deliberately do not match and route to a human instead.
#
# Security updates are grouped here, unlike some other repos in the fleet.
# This repo accumulated seven separate security PRs against a single
# `package-lock.json`, all mutually conflicting. One grouped PR per directory
# needing one human click beats seven serial rebases.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Supply-chain guard: only propose releases that are at least a week old.
    # Security updates are not delayed by cooldown.
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/test/app"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      test-app-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      test-app-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/test/agent-server"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      uv-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      uv-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
