version: 2

# One entry per manifest directory.
#
# Security updates are grouped here, unlike some other repos in the fleet.
# This repo accumulated seven separate security PRs against a single
# `package-lock.json`, all mutually conflicting; one grouped PR per directory
# beats seven serial rebases.
#
# What the `-minor-and-patch` names do and do not buy: the auto-merge gate
# matches that glob on the group name, but it ALSO has a separate branch that
# matches a patch/minor `update-type`. Dependabot reports both for a grouped
# PR, so a `-security` group whose highest bump is patch or minor clears the
# gate and merges on its own -- observed on #84, which merged nine npm
# security updates unattended. Naming a group `-security` only holds it when
# the batch contains a major. That is the behaviour we want; the group names
# are still load-bearing for version updates, where they are the only signal.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Supply-chain guard: only propose releases that are at least a week old.
    # Security updates are not delayed by cooldown.
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/test/app"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      test-app-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      test-app-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/test/agent-server"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      uv-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      uv-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
